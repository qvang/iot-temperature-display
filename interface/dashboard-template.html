<template>
  <div class="monitor-v1">
    <header>
      <h1>Temperature &amp; Humidity</h1>
      <span class="version">Version 1</span>
    </header>

    <div class="readings">
      <section class="panel">
        <p class="label">Temperature</p>
        <p class="value">{{ temperature === null ? '—' : temperature.toFixed(1) }}<small>°C</small></p>
      </section>
      <section class="panel">
        <p class="label">Humidity</p>
        <p class="value">{{ humidity === null ? '—' : humidity.toFixed(1) }}<small>%</small></p>
      </section>
    </div>

    <div class="charts">
      <section class="panel">
        <h2>Temperature history</h2>
        <svg viewBox="0 0 480 150" aria-label="Temperature history">
          <line x1="0" y1="40" x2="480" y2="40" />
          <line x1="0" y1="80" x2="480" y2="80" />
          <line x1="0" y1="120" x2="480" y2="120" />
          <polyline :points="chartPoints(temperatureHistory)" class="temp-line" />
          <text v-if="temperatureHistory.length < 2" x="240" y="82" text-anchor="middle">Waiting for readings</text>
        </svg>
      </section>
      <section class="panel">
        <h2>Humidity history</h2>
        <svg viewBox="0 0 480 150" aria-label="Humidity history">
          <line x1="0" y1="40" x2="480" y2="40" />
          <line x1="0" y1="80" x2="480" y2="80" />
          <line x1="0" y1="120" x2="480" y2="120" />
          <polyline :points="chartPoints(humidityHistory)" class="humidity-line" />
          <text v-if="humidityHistory.length < 2" x="240" y="82" text-anchor="middle">Waiting for readings</text>
        </svg>
      </section>
    </div>

    <footer>
      {{ status }}
      <span v-if="updatedAt"> · Last reading: {{ updatedAt }}</span>
    </footer>
  </div>
</template>

<script>
export default {
  data() {
    return {
      temperature: null,
      humidity: null,
      temperatureHistory: [],
      humidityHistory: [],
      status: 'Waiting for readings',
      updatedAt: ''
    }
  },
  watch: {
    msg: {
      handler(message) {
        if (!message?.payload?.interfaceV1) return
        const reading = message.payload

        if (typeof reading.temperature === 'number') {
          this.temperature = reading.temperature
          this.temperatureHistory.push(reading.temperature)
          if (this.temperatureHistory.length > 20) this.temperatureHistory.shift()
        }
        if (typeof reading.humidity === 'number') {
          this.humidity = reading.humidity
          this.humidityHistory.push(reading.humidity)
          if (this.humidityHistory.length > 20) this.humidityHistory.shift()
        }

        this.status = reading.source === 'test' ? 'Test reading' : 'Sensor reading received'
        this.updatedAt = new Date().toLocaleTimeString('en-GB')
      },
      immediate: true
    }
  },
  methods: {
    chartPoints(values) {
      if (values.length < 2) return ''
      const min = Math.min(...values) - 1
      const max = Math.max(...values) + 1
      return values.map((value, index) => {
        const x = index * 480 / (values.length - 1)
        const y = 130 - (value - min) * 110 / (max - min)
        return `${x.toFixed(1)},${y.toFixed(1)}`
      }).join(' ')
    }
  }
}
</script>
