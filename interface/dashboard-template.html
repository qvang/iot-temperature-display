<template>
  <main class="conditions-monitor" aria-label="Temperature and humidity">
    <div class="conditions-grid">
      <section class="conditions-panel conditions-temperature">
        <h2 class="conditions-label">Temperature</h2>
        <p class="conditions-value">{{ temperature === null ? '—' : temperature.toFixed(1) }}<small>°C</small></p>
        <div class="conditions-history">
          <h3>Recent readings</h3>
          <svg viewBox="0 0 480 150" role="img" aria-label="Temperature trend">
            <line x1="0" y1="40" x2="480" y2="40" />
            <line x1="0" y1="80" x2="480" y2="80" />
            <line x1="0" y1="120" x2="480" y2="120" />
            <polyline :points="chartPoints(temperatureHistory)" />
          </svg>
          <p v-if="temperatureHistory.length < 2" class="conditions-empty">Waiting for readings</p>
        </div>
      </section>

      <section class="conditions-panel conditions-humidity">
        <h2 class="conditions-label">Humidity</h2>
        <p class="conditions-value">{{ humidity === null ? '—' : humidity.toFixed(1) }}<small>%</small></p>
        <div class="conditions-history">
          <h3>Recent readings</h3>
          <svg viewBox="0 0 480 150" role="img" aria-label="Humidity trend">
            <line x1="0" y1="40" x2="480" y2="40" />
            <line x1="0" y1="80" x2="480" y2="80" />
            <line x1="0" y1="120" x2="480" y2="120" />
            <polyline :points="chartPoints(humidityHistory)" />
          </svg>
          <p v-if="humidityHistory.length < 2" class="conditions-empty">Waiting for readings</p>
        </div>
      </section>
    </div>

    <footer class="conditions-status">
      <span>{{ status }}</span>
      <span v-if="updatedAt">{{ updatedAt }}</span>
    </footer>
  </main>
</template>

<script>
export default {
  data() {
    return {
      temperature: null,
      humidity: null,
      temperatureHistory: [],
      humidityHistory: [],
      status: 'Waiting for readings',
      updatedAt: ''
    }
  },
  watch: {
    msg: {
      handler(message) {
        if (!message?.payload?.interfaceV1) return
        const reading = message.payload

        if (typeof reading.temperature === 'number') {
          this.temperature = reading.temperature
          this.temperatureHistory.push(reading.temperature)
          if (this.temperatureHistory.length > 20) this.temperatureHistory.shift()
        }
        if (typeof reading.humidity === 'number') {
          this.humidity = reading.humidity
          this.humidityHistory.push(reading.humidity)
          if (this.humidityHistory.length > 20) this.humidityHistory.shift()
        }

        this.status = reading.source === 'test' ? 'Test reading' : 'Sensor reading received'
        this.updatedAt = new Date().toLocaleTimeString('en-GB')
      },
      immediate: true
    }
  },
  methods: {
    chartPoints(values) {
      if (values.length < 2) return ''
      const min = Math.min(...values) - 1
      const max = Math.max(...values) + 1
      return values.map((value, index) => {
        const x = index * 480 / (values.length - 1)
        const y = 130 - (value - min) * 110 / (max - min)
        return `${x.toFixed(1)},${y.toFixed(1)}`
      }).join(' ')
    }
  }
}
</script>
