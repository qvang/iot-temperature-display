<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temperature &amp; Humidity</title>
  <style>
    body { margin: 0; padding: 1rem; background: #f3f5f9; }
.conditions-monitor {
  box-sizing: border-box;
  max-width: 68rem;
  container-type: inline-size;
  margin: clamp(.5rem, 2.6vw, 2.5rem) auto;
  padding: clamp(.875rem, 4vw, 3.75rem);
  border-radius: clamp(1.5rem, 4vw, 3rem);
  background:
    radial-gradient(ellipse at 8% 10%, #f9ddc7, transparent 55%),
    radial-gradient(ellipse at 94% 82%, #c2dce9, transparent 61%),
    #e8ebf4;
  color: #172333;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

.conditions-monitor .conditions-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(min(100%, 19rem), 1fr));
  gap: clamp(.75rem, 2vw, 1.25rem);
}

.conditions-monitor .conditions-panel {
  min-width: 0;
  padding: clamp(1.125rem, 3.4vw, 2.375rem);
  border: 1px solid #fff;
  border-radius: clamp(1.125rem, 3vw, 2rem);
  background: #fafbfe;
  box-shadow: 0 12px 28px #263a5910, inset 0 1px 0 #fff;
}

@supports ((backdrop-filter: blur(12px)) or (-webkit-backdrop-filter: blur(12px))) {
  .conditions-monitor .conditions-panel {
    background: linear-gradient(155deg, #ffffffd9, #ffffff91 60%, #ffffffb3);
    -webkit-backdrop-filter: blur(12px);
    backdrop-filter: blur(12px);
  }
}

.conditions-monitor .conditions-temperature { --reading-accent: #98452e; }
.conditions-monitor .conditions-humidity { --reading-accent: #215d83; }

.conditions-monitor .conditions-label {
  margin: 0;
  color: var(--reading-accent);
  font-size: 1rem;
  font-weight: 650;
}

.conditions-monitor .conditions-value {
  margin: .65rem 0 1.8rem;
  font-size: 3.1rem;
  font-size: clamp(3.1rem, 8.5cqi, 5.75rem);
  font-weight: 550;
  line-height: 1;
  letter-spacing: -.065em;
  font-variant-numeric: tabular-nums;
}

.conditions-monitor .conditions-value small {
  margin-inline-start: .32em;
  color: #4e5c6d;
  font-size: .38em;
  font-weight: 500;
  letter-spacing: -.03em;
  vertical-align: .19em;
}

.conditions-monitor .conditions-history {
  position: relative;
  padding-top: 1rem;
  border-top: 1px solid #52677d2e;
}

.conditions-monitor .conditions-history h3,
.conditions-monitor .conditions-status,
.conditions-monitor .conditions-empty {
  margin: 0;
  color: #48586b;
  font-size: .8125rem;
  font-weight: 550;
}

.conditions-monitor svg {
  display: block;
  width: 100%;
  height: auto;
  margin-top: .35rem;
  overflow: visible;
}

.conditions-monitor svg line { stroke: #52677d26; }
.conditions-monitor svg polyline {
  fill: none;
  stroke: var(--reading-accent);
  stroke-width: 2.75;
  stroke-linecap: round;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
}

.conditions-monitor .conditions-empty {
  position: absolute;
  inset: 55% .25rem auto;
  text-align: center;
}

.conditions-monitor .conditions-status {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: .3rem 1rem;
  margin: 1rem .25rem 0;
  font-variant-numeric: tabular-nums;
}

@media (prefers-reduced-transparency: reduce), (prefers-contrast: more) {
  .conditions-monitor .conditions-panel {
    background: #fafbfe;
    -webkit-backdrop-filter: none;
    backdrop-filter: none;
  }
}
  </style>
</head>
<body>
  <main class="conditions-monitor" aria-label="Temperature and humidity">
    <div class="conditions-grid">
      <section class="conditions-panel conditions-temperature">
        <h2 class="conditions-label">Temperature</h2>
        <p class="conditions-value">22.4<small>°C</small></p>
        <div class="conditions-history">
          <h3>Recent readings</h3>
          <svg viewBox="0 0 480 150" role="img" aria-label="Temperature trend">
            <line x1="0" y1="40" x2="480" y2="40" />
            <line x1="0" y1="80" x2="480" y2="80" />
            <line x1="0" y1="120" x2="480" y2="120" />
            <polyline points="0.0,105.0 43.6,100.0 87.3,102.5 130.9,87.5 174.5,77.5 218.2,82.5 261.8,65.0 305.5,57.5 349.1,60.0 392.7,45.0 436.4,47.5 480.0,50.0" />
          </svg>
        </div>
      </section>

      <section class="conditions-panel conditions-humidity">
        <h2 class="conditions-label">Humidity</h2>
        <p class="conditions-value">48.3<small>%</small></p>
        <div class="conditions-history">
          <h3>Recent readings</h3>
          <svg viewBox="0 0 480 150" role="img" aria-label="Humidity trend">
            <line x1="0" y1="40" x2="480" y2="40" />
            <line x1="0" y1="80" x2="480" y2="80" />
            <line x1="0" y1="120" x2="480" y2="120" />
            <polyline points="0.0,39.3 43.6,47.0 87.3,41.2 130.9,58.6 174.5,64.4 218.2,58.6 261.8,79.8 305.5,87.5 349.1,83.7 392.7,99.1 436.4,110.7 480.0,108.8" />
          </svg>
        </div>
      </section>
    </div>

    <footer class="conditions-status">
      <span>Sample readings</span>
    </footer>
  </main>
</body>
</html>
